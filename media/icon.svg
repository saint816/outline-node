  <path d="M60 132 H 84" stroke="#404B66" stroke-width="7" stroke-linecap="round"/>

  <!-- 一级节点 -->
  <circle cx="60" cy="70" r="16" fill="#7AA2F7"/>
  <rect x="92" y="56" width="116" height="28" rx="14" fill="#D3DBEA"/>

  <!-- 二级节点 -->
  <circle cx="106" cy="132" r="13" fill="#9AA4BC"/>
  <rect x="134" y="120" width="80" height="25" rx="12" fill="#9AA4BC"/>

  <circle cx="106" cy="192" r="13" fill="#9AA4BC"/>
  <rect x="134" y="180" width="58" height="25" rx="12" fill="#9AA4BC"/>
</svg>
