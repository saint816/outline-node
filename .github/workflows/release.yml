name: Release

# push tag v* → 全量测试通过后发布到 Marketplace 与 Open VSX（见 docs/10）
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 提到 job 级：step 级 env: 在该 step 自己的 if: 里读不到，条件会永远为假
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 全量测试：和 CI 同一套，发布前不降标准
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: xvfb-run -a node ./test/integration/runTest.mjs

      # tag 必须与 package.json 的 version 一致，否则发错版本
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - run: npx vsce package --no-dependencies

      # 微软 Marketplace 需要 Azure DevOps PAT。没有 PAT 时这一步跳过，
      # 改用 publisher 管理页手动上传 .vsix（不需要 Azure 订阅）。
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"

      # Open VSX（覆盖 VSCodium / Cursor / Gitpod）。namespace 首次发布前必须存在，
      # create-namespace 对已存在的 namespace 会报错，故容错继续。
      - name: Create Open VSX namespace
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx create-namespace outlinenode -p "$OVSX_PAT" || true

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"

      - name: Attach vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
